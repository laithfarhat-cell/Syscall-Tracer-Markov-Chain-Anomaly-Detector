name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Install strace for the Linux live smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          sudo apt-get update
          sudo apt-get install -y strace
      - run: python -m pytest
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m build
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: syscall-hids simulate --quiet --output-dir artifacts/ci
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: syscall-hids-inert-lab
          path: artifacts/ci/
          if-no-files-found: error
