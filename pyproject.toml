[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syscall-markov-hids"
version = "0.1.0"
description = "Streaming syscall collection and sparse Markov-chain behavioral anomaly detection"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
syscall-hids = "main:main"
syscall-hids-generate = "scripts.simulate_behavior:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core", "core.data", "visualizers", "scripts"]
namespaces = false

[tool.setuptools.package-data]
"core.data" = ["*.json", "*.md"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: integration tests requiring Linux strace and ptrace permission"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
